<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sliding Content</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
  display: flex;
  justify-content: center;
  margin-top: 40px;
  font-family: Arial, sans-serif;
}

.slideshow {
  width: 600px;
  height: 300px;
  overflow: hidden;
  border: 2px solid #ccc;
}

.slider {
  display: flex;
  width: 300%; /* 100% × number of slides */
  height: 100%;
  animation: slideLeft 9s infinite;
}

.slide {
  width: 100%;
  padding: 30px;
  box-sizing: border-box;
  flex-shrink: 0;
}

/* Sliding animation */
@keyframes slideLeft {
  0%   { transform: translateX(0%); }
  33%  { transform: translateX(0%); }

  38%  { transform: translateX(-100%); }
  66%  { transform: translateX(-100%); }

  71%  { transform: translateX(-200%); }
  100% { transform: translateX(-200%); }
}

  </style>
</head>
<body>

<div class="slideshow">
  <div class="slider">

    <div class="slide">
      <h1>Welcome</h1>
      <p>This is slide one</p>
      <button>Learn More</button>
    </div>

    <div class="slide">
      <h1>Services</h1>
      <p>Web & App Development</p>
      <img src="service.png">
    </div>

    <div class="slide">
      <h1>Contact</h1>
      <p>Email us anytime</p>
      <button>Send</button>
    </div>

  </div>
</div>

</body>
</html>
